<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit User</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Edit User</h1>

                        <p>
                            Username:
                            <strong th:text="${user.username}">
                                Username
                            </strong>
                        </p>

                        <form
                            th:action="@{/admin/users/{id}/edit(id=${user.userId})}"
                            th:object="${userUpdate}"
                            method="post">

                            <div class="alert alert-danger"
                                 th:if="${#fields.hasGlobalErrors()}">
                                <p class="mb-0"
                                   th:each="error : ${#fields.globalErrors()}"
                                   th:text="${error}">
                                    Update error
                                </p>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label">
                                    Role
                                </label>
                                <select class="form-select"
                                        th:field="*{role}"
                                        required>
                                    <option th:each="roleOption : ${roles}"
                                            th:value="${roleOption.name()}"
                                            th:text="${roleOption.name()}">
                                        USER
                                    </option>
                                </select>
                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('role')}"
                                     th:errors="*{role}">
                                    Role error
                                </div>
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox"
                                       class="form-check-input"
                                       th:field="*{enabled}">
                                <label for="enabled"
                                       class="form-check-label">
                                    Account enabled
                                </label>
                            </div>

                            <div class="form-check mb-4">
                                <input type="checkbox"
                                       class="form-check-input"
                                       th:field="*{passwordChangeRequired}">
                                <label for="passwordChangeRequired"
                                       class="form-check-label">
                                    Require password change
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Save Changes
                            </button>
                            <a th:href="@{/admin/users}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </form>

                        <p class="small text-muted mt-4 mb-0">
                            The last enabled administrator cannot be
                            disabled or changed to the USER role.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script th:replace="~{fragments/navbar :: bootstrapScript}"></script>
</body>
</html>
