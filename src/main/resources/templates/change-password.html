<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Change Password</h1>

                        <p>
                            Account:
                            <strong th:text="${username}">Username</strong>
                        </p>
                        <p class="text-muted">
                            Enter your current password and choose a different
                            password to continue.
                        </p>

                        <form th:action="@{/change-password}"
                              th:object="${passwordChange}"
                              method="post">

                            <div class="alert alert-danger"
                                 role="alert"
                                 th:if="${#fields.hasGlobalErrors()}">
                                <div th:each="error : ${#fields.globalErrors()}"
                                     th:text="${error}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">
                                    Current Password
                                </label>
                                <input type="password"
                                       id="currentPassword"
                                       name="currentPassword"
                                       class="form-control"
                                       autocomplete="current-password"
                                       maxlength="255"
                                       required>
                                <div class="text-danger small"
                                     th:errors="*{currentPassword}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="newPassword" class="form-label">
                                    New Password
                                </label>
                                <input type="password"
                                       id="newPassword"
                                       name="newPassword"
                                       class="form-control"
                                       autocomplete="new-password"
                                       maxlength="255"
                                       required>
                                <div class="text-danger small"
                                     th:errors="*{newPassword}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    Confirm New Password
                                </label>
                                <input type="password"
                                       id="confirmPassword"
                                       name="confirmPassword"
                                       class="form-control"
                                       autocomplete="new-password"
                                       maxlength="255"
                                       required>
                                <div class="text-danger small"
                                     th:errors="*{confirmPassword}"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Change Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:replace="~{fragments/navbar :: bootstrapScript}"></script>
</body>
</html>
