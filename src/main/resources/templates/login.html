<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Login</h1>

                        <div class="alert alert-success"
                             th:if="${successMessage != null}"
                             th:text="${successMessage}">
                            Success message
                        </div>

                        <form th:action="@{/login}"
                              th:object="${login}"
                              method="post">

                            <div class="alert alert-danger"
                                 th:if="${#fields.hasGlobalErrors()}">
                                <p class="mb-0"
                                   th:each="error : ${#fields.globalErrors()}"
                                   th:text="${error}">
                                    Login error
                                </p>
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    Username
                                </label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{username}"
                                       maxlength="255"
                                       autocomplete="username"
                                       required>
                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('username')}"
                                     th:errors="*{username}">
                                    Username error
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input type="password"
                                       class="form-control"
                                       th:field="*{password}"
                                       maxlength="255"
                                       autocomplete="current-password"
                                       required>
                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('password')}"
                                     th:errors="*{password}">
                                    Password error
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Login
                            </button>
                            <a th:href="@{/register}"
                               class="btn btn-outline-secondary">
                                Register
                            </a>
                            <a th:href="@{/users}"
                               class="btn btn-link">
                                Back
                            </a>
                        </form>

                        <p class="small text-muted mt-4 mb-0">
                            Lab 4 demonstrates manual credential checking.
                            Authentication and role authorization are not
                            enforced in this lab.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script th:replace="~{fragments/navbar :: bootstrapScript}"></script>
</body>
</html>
